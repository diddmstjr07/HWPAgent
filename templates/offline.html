<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent - 오프라인</title>
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg: #000000;
            --card: rgba(255, 255, 255, 0.04);
            --text: #e3e3e3;
            --sub: #9aa0a6;
            --accent: #8ab4f8;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(560px, 100%);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            text-align: center;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(138, 180, 248, 0.12);
            color: var(--accent);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 16px;
        }
        h1 { margin: 0 0 12px 0; font-size: 1.7rem; }
        p { margin: 0 0 24px 0; color: var(--sub); line-height: 1.5; }
        button {
            background: linear-gradient(120deg, #8ab4f8, #c58af9);
            color: #0b0c0e;
            border: none;
            border-radius: 14px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(138, 180, 248, 0.25);
            transition: transform 150ms ease, box-shadow 150ms ease;
            width: 100%;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 14px 38px rgba(138, 180, 248, 0.3); }
        button:active { transform: translateY(0); box-shadow: 0 8px 20px rgba(138, 180, 248, 0.22); }
        .footer {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--sub);
        }
    </style>
</head>
<body>
    <main class="card" role="status">
        <div class="pill">오프라인 상태</div>
        <h1>연결이 끊어졌어요</h1>
        <p>네트워크에 연결할 수 없어 임시 페이지를 표시했습니다. 연결이 복구되면 다시 시도해주세요.</p>
        <button type="button" onclick="window.location.reload()">다시 시도</button>
        <div class="footer">캐시된 콘텐츠만 표시됩니다.</div>
    </main>
</body>
</html>
