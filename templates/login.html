<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOC Agent | 로그인</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-deep: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --accent-primary: #0F172A;
            --accent-glow: rgba(15, 23, 42, 0.15);
            --accent-gradient: linear-gradient(135deg, #0F172A 0%, #334155 100%);
            --shadow-soft: 0 20px 40px -10px rgba(15, 23, 42, 0.05);
            --radius-md: 16px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            min-height: 100dvh; /* Allow scrolling if content is tall */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto; /* Enable vertical scroll */
            position: relative;
        }

        /* Ambient Background Effect */
        body::before {
            content: ''; position: fixed; top: -10%; right: -5%; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(203, 213, 225, 0.2) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; bottom: -10%; left: -5%; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(226, 232, 240, 0.25) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            margin: auto; /* Center vertically if flex container allows */
        }

        .brand-logo {
            width: 64px; height: 64px;
            background: #fff;
            border: 1px solid #E2E8F0;
            border-radius: 18px; margin: 0 auto 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: var(--accent-primary);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            background: linear-gradient(135deg, #fff, #F8FAFC);
            /* Burst Source Animation */
            position: relative; z-index: 20;
            animation: logo-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .brand-logo i { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .login-card {
            background: var(--bg-card);
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
            text-align: center;
            /* Burst Out Animation */
            animation: card-burst 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
            transform-origin: top center;
        }

        /* Staggered Content Animation */
        .login-title { animation: item-slide-down 0.5s 0.4s backwards; }
        .login-desc { animation: item-slide-down 0.5s 0.45s backwards; }
        #authForm > * { animation: item-slide-down 0.5s backwards; }
        #authForm .input-group { animation-delay: 0.5s; }
        #authForm .btn-primary { animation-delay: 0.55s; }
        #authForm .status-message { animation-delay: 0.55s; }
        #authForm .toggle-link { animation-delay: 0.6s; }
        #authForm .divider { animation-delay: 0.65s; }
        #authForm .social-login { animation-delay: 0.7s; }

        @keyframes logo-pop {
            0% { opacity: 0; transform: scale(0) rotate(-45deg); }
            60% { transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes card-burst {
            0% { opacity: 0; transform: translateY(-40px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes item-slide-down {
            0% { opacity: 0; transform: translateY(-15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .login-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px;
            letter-spacing: -0.02em;
        }

        .login-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .input-group {
            display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;
        }

        .input-field {
            position: relative;
            display: flex; align-items: center;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: 14px 16px;
            transition: all 0.2s ease;
        }
        .input-field:focus-within {
            background: #fff;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
            transform: translateY(-1px);
        }
        .input-field i {
            color: #94A3B8; font-size: 1.1rem; margin-right: 12px; transition: color 0.2s;
        }
        .input-field:focus-within i { color: var(--accent-primary); }

        .input-field input {
            flex: 1; border: none; background: transparent;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            font-size: 0.95rem; color: var(--text-main);
            padding: 0;
        }
        .input-field input::placeholder { color: #CBD5E1; }
        .register-only-field {
            display: none;
            flex-direction: column;
            gap: 7px;
            text-align: left;
        }
        .field-help {
            margin: 0 4px;
            color: var(--text-muted);
            font-size: 0.76rem;
            line-height: 1.45;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px var(--accent-glow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.01em;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -8px var(--accent-glow);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.7; cursor: wait; transform: none; }

        .toggle-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .toggle-link:hover { color: var(--accent-primary); text-decoration: underline; }

        .divider {
            display: flex; align-items: center; margin: 28px 0 20px;
            color: var(--text-muted); font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #E2E8F0;
        }
        .divider span { padding: 0 12px; }

        .social-login { display: flex; justify-content: center; }

        /* 제거한 Google/Kakao/Naver 버튼과 같은 형태(50x50 원형, 로고만).
           호버는 위로 뜨는 대신 채움을 반전시킨다. 로고는 currentColor라 함께 뒤집힌다. */
        .btn-codex {
            position: relative;
            width: 50px; height: 50px; border-radius: 50%;
            border: 1px solid #E2E8F0; background: #fff; color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            padding: 0; cursor: pointer;
            transition: background-color 0.22s ease, color 0.22s ease,
                        border-color 0.22s ease, box-shadow 0.22s ease;
        }
        .btn-codex:hover:not(:disabled),
        .btn-codex:focus-visible:not(:disabled) {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #fff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .btn-codex:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-codex svg { flex-shrink: 0; color: inherit; }

        /* 글자가 없으므로 연결 상태는 모서리 점으로만 알린다. */
        .btn-codex .codex-dot {
            position: absolute; top: 2px; right: 2px;
            width: 9px; height: 9px; border-radius: 50%;
            background: #CBD5E1; border: 2px solid #fff;
            transition: background-color 0.22s ease, border-color 0.22s ease;
        }
        /* 점을 둘러싼 링은 버튼 바탕을 따라가야 배경에서 오려낸 것처럼 보인다. */
        .btn-codex:hover:not(:disabled) .codex-dot,
        .btn-codex:focus-visible:not(:disabled) .codex-dot {
            border-color: var(--accent-primary);
        }
        .btn-codex[data-status="connected"] .codex-dot { background: #10A37F; }
        .btn-codex[data-status="pending"] .codex-dot { background: #F59E0B; }
        .btn-codex[data-status="error"] .codex-dot { background: #EF4444; }

        .codex-panel {
            display: none; margin-top: 16px; padding: 18px;
            border: 1px solid #E2E8F0; border-radius: 14px; background: #F8FAFC;
            text-align: left;
        }
        .codex-panel.show { display: block; }
        .codex-panel p { font-size: 0.83rem; color: var(--text-muted); margin: 0 0 12px; line-height: 1.6; }
        .codex-code {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 12px 14px; border-radius: 10px; background: #fff;
            border: 1px solid #E2E8F0; margin-bottom: 12px;
        }
        .codex-code strong {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 1.15rem; letter-spacing: 0.16em; color: var(--text-main);
        }
        .codex-code button {
            border: none; background: var(--accent-gradient); color: #fff; border-radius: 8px;
            padding: 6px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: box-shadow 0.2s ease;
        }
        .codex-code button:hover { box-shadow: 0 0 0 3px var(--accent-glow); }
        .codex-open {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.85rem; font-weight: 600; color: var(--text-main); text-decoration: none;
            border-bottom: 1px solid #CBD5E1; padding-bottom: 2px;
            transition: border-color 0.2s ease;
        }
        .codex-open:hover { border-color: var(--accent-primary); }

        .home-link {
            position: absolute; top: 24px; left: 24px;
            display: flex; align-items: center; gap: 6px;
            color: var(--text-muted); text-decoration: none;
            font-size: 0.9rem; font-weight: 500;
            padding: 8px 12px; border-radius: 10px;
            transition: all 0.2s;
            z-index: 20;
        }
        .home-link:hover { background: rgba(255,255,255,0.5); color: var(--accent-primary); }

        .status-message {
            margin-top: 16px;
            min-height: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #EF4444;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .status-message.success { color: #10B981; }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { align-items: flex-start; padding-top: 60px; } /* Start from top on mobile to avoid cut-off */
            .login-container { padding: 16px; max-width: 100%; }
            .login-card { padding: 32px 20px; border-radius: 20px; }
            .brand-logo { width: 56px; height: 56px; font-size: 1.5rem; margin-bottom: 20px; }
            .login-title { font-size: 1.4rem; }
            .login-desc { font-size: 0.9rem; margin-bottom: 24px; }
            .input-field { padding: 12px 14px; }
            .btn-primary { padding: 14px; }
            .home-link { top: 16px; left: 16px; padding: 6px 10px; font-size: 0.85rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/score-dream.css">
</head>
<body>

    <a href="/" class="home-link"><i class="bi bi-chevron-left"></i> 홈으로</a>

    <div class="login-container">
        <div class="brand-logo">
            <i class="bi bi-stars"></i>
        </div>

        <div class="login-card">
            <h1 class="login-title" id="pageTitle">환영합니다</h1>
            <p class="login-desc" id="pageDesc">계정에 로그인하고 문서 작업을 계속하세요.</p>

            <form id="authForm">
                <div class="input-group">
                    <div class="input-field" id="field-name" style="display:none;">
                        <i class="bi bi-person"></i>
                        <input type="text" id="input-name" placeholder="이름 (회원가입용)">
                    </div>
                    <div class="register-only-field" id="field-student-number">
                        <div class="input-field">
                            <i class="bi bi-mortarboard"></i>
                            <input
                                type="text"
                                id="input-student-number"
                                inputmode="numeric"
                                maxlength="4"
                                pattern="[1-3][1-9](0[1-9]|[1-9][0-9])"
                                autocomplete="off"
                                aria-label="학년 반 번호로 구성된 학번 4자리"
                                aria-describedby="student-number-help"
                                placeholder="학번 4자리 (예: 2412)"
                            >
                        </div>
                        <p class="field-help" id="student-number-help"><strong>2412</strong> = 2학년 4반 12번 · 학년은 매년 3월 자동 변경되며 새 학번은 이메일로 안내합니다.</p>
                    </div>
                    <div class="input-field">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="input-email" placeholder="이메일 주소" required>
                    </div>
                    <div class="input-field">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="input-password" placeholder="비밀번호" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="btn-submit">로그인</button>
                
                <div class="status-message" id="status-msg"></div>

                <div class="toggle-link" id="btn-toggle-mode">계정이 없으신가요? 회원가입</div>

                <div class="divider"><span>로그인한 뒤 ChatGPT 사용량 연결</span></div>
                <div class="social-login">
                <button type="button" class="btn-codex" id="btn-codex" data-status="disconnected"
                        aria-label="ChatGPT 사용량 연결하기" title="ChatGPT 사용량 연결하기">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path fill="currentColor" d="M22.28 9.82a5.99 5.99 0 0 0-.52-4.91 6.05 6.05 0 0 0-6.52-2.9A6 6 0 0 0 10.7.02a6.05 6.05 0 0 0-5.77 4.19 5.99 5.99 0 0 0-4 2.9 6.05 6.05 0 0 0 .74 7.1 5.99 5.99 0 0 0 .51 4.91 6.05 6.05 0 0 0 6.52 2.9A5.99 6.05 0 0 0 13.3 24a6.05 6.05 0 0 0 5.77-4.2 5.99 5.99 0 0 0 4-2.9 6.05 6.05 0 0 0-.75-7.09zM13.3 22.43a4.5 4.5 0 0 1-2.88-1.04l.14-.08 4.78-2.76a.78.78 0 0 0 .39-.68v-6.74l2.02 1.17a.07.07 0 0 1 .04.05v5.58a4.5 4.5 0 0 1-4.5 4.5zM3.63 18.3a4.47 4.47 0 0 1-.54-3.01l.14.09 4.79 2.76a.78.78 0 0 0 .78 0l5.84-3.37v2.33a.08.08 0 0 1-.03.06L9.78 19.96a4.5 4.5 0 0 1-6.15-1.65zM2.37 7.9a4.5 4.5 0 0 1 2.35-1.98v5.68a.77.77 0 0 0 .38.67l5.83 3.36-2.02 1.17a.07.07 0 0 1-.07 0L4 14.01a4.5 4.5 0 0 1-1.65-6.14zm16.6 3.86-5.83-3.4L15.16 7.2a.07.07 0 0 1 .07 0l4.83 2.79a4.49 4.49 0 0 1-.68 8.1v-5.67a.79.79 0 0 0-.4-.67zm2.01-3.03-.14-.09-4.78-2.79a.78.78 0 0 0-.79 0L9.44 9.23V6.9a.07.07 0 0 1 .03-.06l4.83-2.79a4.5 4.5 0 0 1 6.68 4.66zM8.34 12.86l-2.02-1.17a.08.08 0 0 1-.04-.06V6.07a4.5 4.5 0 0 1 7.38-3.45l-.14.08-4.79 2.76a.78.78 0 0 0-.39.68zm1.1-2.37 2.6-1.5 2.6 1.5v3l-2.6 1.5-2.6-1.5z"/>
                    </svg>
                    <span class="codex-dot" aria-hidden="true"></span>
                </button>
                </div>

                <div class="codex-panel" id="codex-panel">
                    <p>아래 코드를 복사한 뒤 ChatGPT 인증 페이지에서 입력해 주세요. 승인하면 이 계정에 사용량이 연결됩니다(로그인 수단은 아닙니다).</p>
                    <div class="codex-code">
                        <strong id="codex-user-code">----</strong>
                        <button type="button" id="codex-copy">복사</button>
                    </div>
                    <a class="codex-open" id="codex-open" href="#" target="_blank" rel="noopener noreferrer">
                        인증 페이지 열기 <i class="bi bi-box-arrow-up-right"></i>
                    </a>
                </div>
            </form>
        </div>
        
        <div style="text-align: center; margin-top: 24px; color: #94A3B8; font-size: 0.75rem;">
            &copy; DOC Agent. All rights reserved.
        </div>
    </div>

    <script>
        const state = {
            isLogin: true
        };

        const elements = {
            title: document.getElementById('pageTitle'),
            desc: document.getElementById('pageDesc'),
            fieldName: document.getElementById('field-name'),
            inputName: document.getElementById('input-name'),
            fieldStudentNumber: document.getElementById('field-student-number'),
            inputStudentNumber: document.getElementById('input-student-number'),
            inputEmail: document.getElementById('input-email'),
            inputPw: document.getElementById('input-password'),
            btnSubmit: document.getElementById('btn-submit'),
            btnToggle: document.getElementById('btn-toggle-mode'),
            statusMsg: document.getElementById('status-msg'),
            form: document.getElementById('authForm')
        };

        const isSafeRedirect = (target) => {
            if (!target) return false;
            if (!target.startsWith('/')) return false;
            if (target.startsWith('//')) return false;
            return true;
        };

        const getNextTarget = () => {
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next');
            return isSafeRedirect(next) ? next : '/';
        };

        const nextTarget = getNextTarget();

        // ===== ChatGPT(Codex) 기기 코드 연결 =====
        // 연결은 사용 한도를 빌려오는 것일 뿐, 로그인이 아니다. 서버가 로그인 없는
        // 연결 요청을 401로 막으므로, 그 경우에는 로그인부터 하라고 알려 준다.
        const codex = {
            btn: document.getElementById('btn-codex'),
            panel: document.getElementById('codex-panel'),
            userCode: document.getElementById('codex-user-code'),
            copyBtn: document.getElementById('codex-copy'),
            openLink: document.getElementById('codex-open'),
            pollTimer: null
        };

        const CODEX_LABELS = {
            connected: 'ChatGPT 사용량 연결됨',
            pending: 'ChatGPT 승인 대기 중...',
            error: '연결 실패 · 다시 시도',
            unavailable: 'ChatGPT 연결 준비 중',
            disconnected: 'ChatGPT 사용량 연결하기'
        };

        // 로고만 있는 버튼이라 상태는 모서리 점과 aria-label/title로만 전달한다.
        // pending은 '승인 대기'일 뿐 재시도를 막지 않는다. 다시 누르면 새 코드를 발급한다.
        // 요청이 날아가는 동안의 중복 클릭만 busy로 잠근다.
        const setCodexStatus = (status, { busy = false } = {}) => {
            codex.btn.dataset.status = status;
            const label = status === 'pending' && !codex.panel.classList.contains('show')
                ? '다시 코드 받기'
                : (CODEX_LABELS[status] || CODEX_LABELS.disconnected);
            codex.btn.setAttribute('aria-label', label);
            codex.btn.setAttribute('title', label);
            codex.btn.disabled = busy || status === 'unavailable';
        };

        const stopCodexPoll = () => {
            if (codex.pollTimer) { clearInterval(codex.pollTimer); codex.pollTimer = null; }
        };

        const onCodexConnected = () => {
            stopCodexPoll();
            setCodexStatus('connected');
            codex.panel.classList.remove('show');
            showStatus('ChatGPT 사용량이 연결되었습니다. 이동합니다...', true);
            window.location.href = nextTarget;
        };

        const pollCodexStatus = async () => {
            try {
                const res = await fetch('/api/auth/codex/status', { credentials: 'same-origin' });
                const data = await res.json();
                if (!res.ok) return;
                const status = data?.connection?.status;
                if (status === 'connected') { onCodexConnected(); return; }
                if (status === 'error') {
                    stopCodexPoll();
                    setCodexStatus('error');
                    showStatus(data.connection.error || 'ChatGPT 연결에 실패했습니다.', false);
                }
            } catch (_) { /* 폴링 실패는 조용히 넘어가고 다음 주기에 재시도 */ }
        };

        codex.btn?.addEventListener('click', async () => {
            setCodexStatus('pending', { busy: true });
            clearStatus();
            try {
                const res = await fetch('/api/auth/codex/connect', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                const data = await res.json();
                if (!res.ok) {
                    setCodexStatus(res.status === 401 ? 'disconnected' : 'error');
                    // 401 = 아직 앱 로그인이 없다. 연결은 로그인 뒤에만 된다.
                    showStatus(data.error || 'ChatGPT 연결에 실패했습니다.', false);
                    return;
                }
                if (data.connected) { onCodexConnected(); return; }

                codex.userCode.textContent = data.login.user_code;
                codex.openLink.href = data.login.verification_url;
                codex.panel.classList.add('show');
                setCodexStatus('pending');
                window.open(data.login.verification_url, '_blank', 'noopener,noreferrer');

                stopCodexPoll();
                codex.pollTimer = setInterval(pollCodexStatus, 3000);
            } catch (err) {
                setCodexStatus('error');
                showStatus('ChatGPT 연결 중 오류가 발생했습니다.', false);
            }
        });

        codex.copyBtn?.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(codex.userCode.textContent.trim());
                codex.copyBtn.textContent = '복사됨';
                setTimeout(() => { codex.copyBtn.textContent = '복사'; }, 1500);
            } catch (_) { /* 클립보드 거부 시 코드가 화면에 보이므로 수동 복사 */ }
        });

        // 진입 시 이미 연결돼 있는지 확인한다.
        (async () => {
            try {
                const res = await fetch('/api/auth/codex/status', { credentials: 'same-origin' });
                const data = await res.json();
                if (!res.ok) { setCodexStatus('error'); return; }
                if (!data.configured) { setCodexStatus('unavailable'); return; }
                setCodexStatus(data.connection.status);
            } catch (_) { setCodexStatus('disconnected'); }
        })();

        // Toggle Login / Register Mode
        elements.btnToggle.addEventListener('click', () => {
            state.isLogin = !state.isLogin;
            updateUI();
        });

        function updateUI() {
            elements.statusMsg.textContent = '';
            elements.statusMsg.className = 'status-message';
            
            if (state.isLogin) {
                elements.title.textContent = '환영합니다';
                elements.desc.textContent = '계정에 로그인하고 문서 작업을 계속하세요.';
                elements.fieldName.style.display = 'none';
                elements.fieldStudentNumber.style.display = 'none';
                elements.inputName.removeAttribute('required');
                elements.inputStudentNumber.removeAttribute('required');
                elements.btnSubmit.textContent = '로그인';
                elements.btnToggle.textContent = '계정이 없으신가요? 회원가입';
            } else {
                elements.title.textContent = '회원가입';
                elements.desc.textContent = '새로운 계정을 만들고 DOC Agent를 시작하세요.';
                elements.fieldName.style.display = 'flex';
                elements.fieldStudentNumber.style.display = 'flex';
                elements.inputName.setAttribute('required', 'true');
                elements.inputStudentNumber.setAttribute('required', 'true');
                elements.btnSubmit.textContent = '계정 만들기';
                elements.btnToggle.textContent = '이미 계정이 있으신가요? 로그인';
            }
        }

        // Handle Submit
        elements.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = elements.inputEmail.value.trim();
            const password = elements.inputPw.value;
            const name = elements.inputName.value.trim();
            const studentNumber = elements.inputStudentNumber.value.trim();

            if (!email || !password) return;
            if (!state.isLogin && !name) return;
            if (!state.isLogin && !/^[1-3][1-9](?:0[1-9]|[1-9]\d)$/.test(studentNumber)) {
                showStatus('학번 형식을 확인하세요. 예: 2412 = 2학년 4반 12번', false);
                elements.inputStudentNumber.focus();
                return;
            }

            setLoading(true);

            try {
                const endpoint = state.isLogin ? '/api/auth/login' : '/api/auth/register';
                const payload = { email, password };
                if (!state.isLogin) {
                    payload.name = name;
                    payload.student_number = studentNumber;
                }

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.success) {
                    // 새로 가입한 학생은 먼저 온보딩에서 탐구의 출발점을 만든다.
                    const target = state.isLogin ? nextTarget : '/welcome';
                    showStatus(state.isLogin ? '로그인 성공! 이동합니다...' : '가입 완료! 시작해볼게요...', true);
                    setTimeout(() => {
                        window.location.href = target;
                    }, 1200);
                } else {
                    showStatus(data.error || '오류가 발생했습니다.', false);
                    setLoading(false);
                }
            } catch (err) {
                console.error(err);
                showStatus('서버 연결에 실패했습니다.', false);
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            elements.btnSubmit.disabled = isLoading;
            elements.btnSubmit.textContent = isLoading ? '처리 중...' : (state.isLogin ? '로그인' : '계정 만들기');
        }

        function clearStatus() {
            elements.statusMsg.textContent = '';
            elements.statusMsg.className = 'status-message';
        }

        function showStatus(msg, isSuccess) {
            elements.statusMsg.textContent = msg;
            elements.statusMsg.className = isSuccess ? 'status-message success' : 'status-message';
            if(isSuccess) {
                elements.statusMsg.innerHTML = `<i class="bi bi-check-circle-fill"></i> ${msg}`;
            } else {
                elements.statusMsg.innerHTML = `<i class="bi bi-exclamation-circle-fill"></i> ${msg}`;
            }
        }
    </script>
</body>
</html>
