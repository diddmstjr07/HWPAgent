<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWP Agent - Gemini 문서 생성</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
</head>
<body>
    <div class="main-container">
        <header class="app-header">
            <div class="brand">
                <img src="/static/images/logo.png" alt="HWP Agent 로고">
                <span>HWP Agent</span>
            </div>
            <div id="headerActions" class="header-actions" style="display: none;">
                <button id="styleBtn" class="btn btn-secondary"><i class="bi bi-palette"></i> 서식</button>
                <select id="formatSelect" class="form-control" style="width: auto;">
                    <option value="docx" selected>DOCX</option>
                    <option value="pdf">PDF</option>
                    <option value="hwp">HWP</option>
                    <option value="md">Markdown</option>
                </select>
                <button id="saveBtn" class="btn btn-primary">
                    <i class="bi bi-download"></i>
                    <span id="saveBtnText">저장</span>
                </button>
            </div>
        </header>

        <main class="results-container">
            <div id="placeholder" class="placeholder">
                <div class="doc-icon"><i class="bi bi-file-earmark-text"></i></div>
                <h2>AI 문서 작성을 시작해 보세요</h2>
                <p>만들고 싶은 문서에 대해 아래 입력창에 설명해주세요.</p>
            </div>

            <div id="documentPreview" class="document-preview" style="display: none;">
                <h1 id="previewTitle" class="preview-title"></h1>
                <div id="previewContent" class="preview-content"></div>
            </div>
        </main>
        
        <footer class="input-area">
            <div id="refineControlSection" class="refine-section" style="display: none;">
                <!-- AI 수정 모드 컨트롤이 여기에 동적으로 추가될 수 있습니다. -->
            </div>
             <div id="initialInputSection">
                <textarea 
                    id="userRequest" 
                    placeholder="예: 기후 변화에 대한 사회탐구 보고서를 작성해줘"
                    rows="3"
                ></textarea>
                <div class="action-buttons">
                    <button id="templateUploadBtn" class="btn btn-secondary" type="button" title="양식 파일 업로드">
                        <i class="bi bi-file-earmark-arrow-up"></i>
                    </button>
                    <input type="file" id="templateFileInput" accept=".docx,.hwp,.hml,.txt,.md" hidden>
                    
                    <button id="generateBtn" class="btn btn-primary" type="button">
                        <span class="btn-text">생성</span>
                        <div class="spinner" style="display: none;"></div>
                    </button>
                </div>
             </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="toast" class="toast"></div>

    <div id="styleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="bi bi-palette2"></i> 문서 서식 설정</h2>
                <button class="modal-close" id="styleModalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="fontId">전체 폰트</label>
                    <select id="fontId" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label for="fontSize">본문 크기</label>
                    <input type="number" id="fontSize" class="form-control" value="11" min="8" max="24" step="0.5">
                </div>
                <div class="form-group">
                    <label for="lineSpacing">줄 간격</label>
                    <input type="number" id="lineSpacing" class="form-control" value="1.5" min="1" max="2.5" step="0.1">
                </div>
                <div class="form-group">
                    <label for="paragraphSpacing">문단 간격 (pt)</label>
                    <input type="number" id="paragraphSpacing" class="form-control" value="8" min="0" max="32">
                </div>
                <div class="form-group">
                    <label>사용자 폰트 업로드</label>
                     <div class="font-upload-actions">
                        <input type="file" id="fontFileInput" accept=".ttf,.otf" hidden>
                        <button id="fontUploadBtn" type="button" class="btn btn-secondary"><i class="bi bi-upload"></i> 폰트 파일 선택</button>
                        <span id="fontFileStatus">선택된 폰트 없음</span>
                    </div>
                </div>
                <div class="form-group">
                     <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="treatImagesAsText">
                        <label class="form-check-label" for="treatImagesAsText">이미지를 텍스트(자리표시자)로 처리</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary">취소</button>
                <button id="styleModalApplyBtn" class="btn btn-primary">적용</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
