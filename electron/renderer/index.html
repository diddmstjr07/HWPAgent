<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOC Agent - Admin Console</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <div class="brand-text">
                    <div class="app-name">DOC Agent</div>
                    <div class="app-role">Admin Access</div>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="info-card">
                    <div class="info-label"><i class="bi bi-diagram-3"></i> Target Base</div>
                    <div id="targetBase" class="info-value">Initializing...</div>
                </div>
                
                <div class="security-badges">
                    <span class="badge"><i class="bi bi-check-circle-fill"></i> Secure</span>
                    <span class="badge"><i class="bi bi-key-fill"></i> Token</span>
                </div>
            </div>

            <button id="quitBtn" class="btn-sidebar-exit">
                <i class="bi bi-power"></i> <span>Exit Console</span>
            </button>
        </aside>

        <main class="main-content">
            <div class="login-container">
                <div class="login-header">
                    <h1>Administrator</h1>
                    <p>Enter your credentials to access the console.</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="input-group">
                        <label>Admin ID</label>
                        <div class="input-glass-container">
                            <i class="bi bi-person-badge"></i>
                            <input type="text" id="adminId" class="form-input" placeholder="Admin ID" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-glass-container">
                            <i class="bi bi-shield-lock"></i>
                            <input type="password" id="adminPassword" class="form-input" placeholder="Password" autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-3d">
                        <span>Verify & Open</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                    
                    <div id="status" class="status-message"></div>
                </form>
            </div>
        </main>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
